<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatchField · Reserva canchas y arma tu equipo</title>
  <meta name="description" content="MatchField: busca y reserva canchas sintéticas de fútbol en Colombia, encuentra jugadores disponibles por zona y conforma tu equipo.">
  <meta name="theme-color" content="#0b2540">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7a4a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>

  <header class="topbar">
    <div class="container topbar__in">
      <a class="brand" href="#/" aria-label="MatchField, ir al inicio">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#17a566"/><circle cx="16" cy="16" r="7" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 9v14M9 16h14" stroke="#fff" stroke-width="2"/></svg>
        <span>Match<strong>Field</strong></span>
      </a>

      <nav id="nav" class="nav" aria-label="Principal">
        <a href="#/" data-route="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
          <span>Inicio</span>
        </a>
        <a href="#/canchas" data-route="canchas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h4M17 12h4"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span>Canchas</span>
        </a>
        <a href="#/mis-partidas" data-route="mis-partidas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span>Mis partidas</span>
          <b id="nav-badge" class="nav__badge" hidden></b>
        </a>
        <a href="#/perfil" data-route="perfil">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span>Perfil</span>
        </a>
      </nav>

      <a id="chip" class="chip" href="#/perfil"></a>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer__in">
      <p>MatchField · Proyecto académico de Programación Web, Universidad ECCI. Los datos de canchas y jugadores son de ejemplo y se guardan solo en este navegador.</p>
      <button type="button" id="btn-reset" class="link-btn">Restablecer datos de ejemplo</button>
    </div>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:1rem">MatchField necesita JavaScript activado para funcionar.</p></noscript>

  <script src="js/utils.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="data/seed.js" defer></script>
  <script src="js/services.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
